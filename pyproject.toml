[project]
name = "video-social-bot"
version = "0.1.0"
description = "Telegram bot and FastAPI dashboard for short-video remastering and caption generation."
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=25.1.0",
  "aiogram>=3.28.2",
  "aiosqlite>=0.22.1",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "openai>=2.36.0",
  "pydantic-settings>=2.14.1",
  "python-multipart>=0.0.28",
  "sqlalchemy>=2.0.49",
  "uvicorn>=0.47.0",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1.0",
  "mypy>=2.1.0",
  "pytest>=9.0.3",
  "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["aiogram.*", "aiofiles.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
