services:
  web:
    build: .
    command: uvicorn video_social_bot.web:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - app-storage:/app/storage
    restart: unless-stopped

  bot:
    build: .
    command: python -m video_social_bot.bot
    env_file:
      - .env
    volumes:
      - app-data:/app/data
      - app-storage:/app/storage
    restart: unless-stopped

volumes:
  app-data:
  app-storage:
